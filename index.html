 <div class="toprow"><img class="sigil" src="logo-arise.jpg" alt="ARISE logo"><div><div class="brand">SOLO SYSTEM</div><div class="sub">REALITY QUEST INTERFACE · V.2.0</div></div><div class="spacer"></div><div><div class="rank" id="rank">E-RANK</div><div class="lv" id="level">LV. 1</div></div></div>
 <div class="xpbar"><span id="xpfill"></span></div><div class="xplabel"><span id="xptext">0 / 100 XP</span><span id="tolevel">100 XP TO LEVEL UP</span></div>
</header>
<div class="metrics">
 <div class="metric"><label>TOTAL EXPERIENCE</label><strong id="totalxp">0</strong><small>Lifetime XP</small></div>
 <div class="metric"><label>DAILY REWARD</label><strong id="todayxp">0</strong><small id="todayquests">0 quests complete</small></div>
 <div class="metric"><label>STAT POINTS</label><strong id="points">0</strong><small>Available to allocate</small></div>
 <div class="metric"><label>STREAK</label><strong id="streak">0 DAYS</strong><small>Days with XP claimed</small></div>
</div>
<nav class="nav" id="nav">
<button data-tab="dashboard" class="active">⌂ Status</button><button data-tab="quests">☑ Daily Quests</button><button data-tab="stats">✧ Attributes</button><button data-tab="skills">⌘ Skill Trees</button><button data-tab="bosses">⚔ Boss Room</button><button data-tab="achievements">♜ Achievements</button><button data-tab="journal">▤ Journal</button><button data-tab="settings">⚙ Save / Settings</button>
</nav>
<div id="view"></div>
<div class="footer">SYSTEM DATA IS STORED LOCALLY · EXPORT BACKUPS REGULARLY</div>
</main><div id="toast" class="toast hidden"></div><div id="alert-root"></div>
<script>
'use strict';
const QUESTS=[
{id:'body',name:'Body Training',desc:'Planned workout, walk or suitable physical activity',xp:15,stat:'STR',icon:'✦'},
{id:'study',name:'Knowledge Hunter',desc:'45 minutes of focused learning',xp:15,stat:'INT',icon:'⌘'},
{id:'discipline',name:'Discipline Protocol',desc:'Complete your most important task',xp:15,stat:'DIS',icon:'◈'},
{id:'coding',name:'Code & Build',desc:'30 minutes of coding or AI practice',xp:20,stat:'TEC',icon:'⌬'},
{id:'career',name:'Career Intelligence',desc:'Learn a money or career skill',xp:10,stat:'ECO',icon:'◇'},
{id:'social',name:'Social Development',desc:'Practise communication or meaningful connection',xp:10,stat:'SOC',icon:'⟡'},
{id:'recovery',name:'Recovery Protocol',desc:'Prioritise sleep and recovery',xp:10,stat:'DIS',icon:'☾'}];
const BODY_TASKS=[{id:'distance',name:'3 km walk or run',desc:'Choose a comfortable pace; walking counts. Stop if you feel unwell.',xp:0},{id:'pushups',name:'Push-ups',desc:'Start with 3 sets of 5–10, or wall/knee push-ups. Keep form comfortable.',xp:0},{id:'situps',name:'Sit-ups or crunches',desc:'2 sets of 8–12 controlled reps; choose crunches if sit-ups feel uncomfortable.',xp:0},{id:'plank',name:'Plank',desc:'2 rounds of 15–30 seconds; stop before form breaks.',xp:0},{id:'squats',name:'Bodyweight squats',desc:'2 sets of 8–12 controlled reps, within a comfortable range.',xp:0}];
const WORKOUTS={'Full-body option':'2 rounds: 8 squats, 5–10 push-ups (wall/knee is fine), 10 glute bridges, 20-second plank. Rest between rounds.','Mobility option':'5–10 minutes of easy shoulder circles, hip hinges, calf raises and gentle stretches.','Low-energy option':'10-minute easy walk and light mobility. Recovery counts; do not push through pain.'};
const ATTRS=[['STR','Strength','Fitness and physical capability'],['INT','Intelligence','Learning and problem-solving'],['DIS','Discipline','Consistency and follow-through'],['TEC','Coding & AI','Technical mastery and projects'],['ECO','Career & Money','Financial literacy and employability'],['SOC','Social Ability','Communication and relationships']];
const TREES=[
['STR · Physical',['Foundation: 3 weeks of safe, consistent activity','Strength: record progress on suitable exercises','Endurance: improve an appropriate activity benchmark']],
['INT · Intelligence',['Focus: complete 5 distraction-free study sessions','Understanding: explain a topic in your own words','Mastery: solve practice questions without notes']],
['DIS · Discipline',['Routine: establish a realistic daily plan','Consistency: complete priority tasks on 5 days in a week','Self-management: complete a weekly review']],
['TEC · Coding & AI',['Python: use functions, lists and dictionaries','Data: clean a dataset and analyse it','Machine learning: train and evaluate a baseline model','Deployment: publish a working project']],
['ECO · Career & Money',['Literacy: make a simple budget','Portfolio: document a project','Employability: prepare a résumé and explain your work']],
['SOC · Social',['Communication: ask clear questions and listen','Confidence: initiate a friendly conversation','Leadership: coordinate a small group task']]];
const ACHS=[['first','First Quest','Earn XP for the first time','✦'],['levelup','Awakening','Reach Level 2','⚡'],['builder','The Builder','Finish and demonstrate a coding feature','⌬'],['knowledge','Knowledge Hunter','Explain a topic without notes','⌘'],['consistency','Consistency','Complete priority tasks on five days','◈'],['social','Social Awakening','Practise a communication skill','⟡'],['boss','Boss Slayer','Clear a weekly boss challenge','⚔'],['monarch','Monarch Candidate','Reach Level 30 and show progress','♜']];
const today=()=>new Date().toLocaleDateString('en-CA');
const weekKey=()=>{let d=new Date(), jan=new Date(d.getFullYear(),0,1);return d.getFullYear()+'-'+Math.ceil((((d-jan)/86400000)+jan.getDay()+1)/7)};
const fresh=()=>({xp:0,quests:{},claimed:[],stats:{STR:0,INT:0,DIS:0,TEC:0,ECO:0,SOC:0},skills:[],achievements:[],boss:{name:'Code Builder',done:false,claimedWeek:''},journal:[],focus:'Balanced Growth',claimHistory:[],questRewards:{},bodyTasks:{},penalty:null,soundOn:true,lastActiveDay:''});
let S=fresh(),tab='dashboard';
function load(){try{const x=localStorage.getItem('solo-system-v2');if(x)S={...fresh(),...JSON.parse(x)}}catch(e){toast('Local storage unavailable. Use Export Backup to protect progress.')}}
function save(){try{localStorage.setItem('solo-system-v2',JSON.stringify(S))}catch(e){}renderHeader()}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function lv(){return Math.floor(S.xp/100)+1}
function rank(){return S.xp<400?'E':S.xp<900?'D':S.xp<1400?'C':S.xp<1900?'B':S.xp<2900?'A':'S'}
function earned(){return (lv()-1)*3}
function spent(){return Object.values(S.stats).reduce((a,b)=>a+b,0)}
function left(){return Math.max(0,earned()-spent())}
function checked(){return S.quests[today()]||[]}
function rewarded(){return (S.questRewards||{})[today()]||[]}
function dailyXP(){return QUESTS.filter(q=>checked().includes(q.id)&&!rewarded().includes(q.id)).reduce((a,q)=>a+q.xp,0)}
function dailyClaimedXP(){return QUESTS.filter(q=>rewarded().includes(q.id)).reduce((a,q)=>a+q.xp,0)}
function claimed(){return QUESTS.every(q=>rewarded().includes(q.id))}
function bodyChecked(){return S.bodyTasks[today()]||[]}
function bodyComplete(){return BODY_TASKS.every(t=>bodyChecked().includes(t.id))}
function localMidnight(){let d=new Date();d.setHours(24,0,0,0);return d}
function clockText(){let ms=localMidnight()-new Date();if(ms<=0)return '00:00:00';let sec=Math.floor(ms/1000),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return [h,m,s].map(n=>String(n).padStart(2,'0')).join(':')}
function themeLevel(){let l=lv(),b=document.body;b.classList.toggle('level-purple',l>=45&&l<75);b.classList.toggle('level-high',l>=75);let hue=l<30?198:l<60?198+((l-30)/30)*70:l<90?268+((l-60)/30)*75:343;let e=l<30?'#27baff':l<60?`hsl(${hue} 100% 70%)`:l<90?`hsl(${hue} 100% 72%)`:`hsl(${(hue+20)%360} 100% 72%)`;b.style.setProperty('--energy',e);b.style.setProperty('--energy2',l<30?'#b3f6ff':l<60?`hsl(${hue} 100% 84%)`:l<90?'#e9baff':'#ffc1f6');document.querySelector('meta[name="theme-color"]')?.setAttribute('content',l<30?'#020810':l<60?'#10051c':l<90?'#16051e':'#1c0315')}
let audioCtx=null;
function sfx(kind='tap'){
 if(!S.soundOn)return;
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  const t=audioCtx.currentTime;
  const tone=(f0,f1,dur,wave='sine',vol=.06,delay=0)=>{
   const o=audioCtx.createOscillator(),g=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();
   o.type=wave;o.frequency.setValueAtTime(f0,t+delay);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+delay+dur);
   filter.type='lowpass';filter.frequency.setValueAtTime(4200,t+delay);filter.frequency.exponentialRampToValueAtTime(900,t+delay+dur);
   g.gain.setValueAtTime(.0001,t+delay);g.gain.exponentialRampToValueAtTime(vol,t+delay+.008);g.gain.exponentialRampToValueAtTime(.0001,t+delay+dur);
   o.connect(filter);filter.connect(g);g.connect(audioCtx.destination);o.start(t+delay);o.stop(t+delay+dur+.02);
  };
  const spark=(delay=0)=>{
   // Crisp electric ignition: tiny filtered noise crackle + two bright, short descending zaps.
   const n=Math.floor(audioCtx.sampleRate*.075),buf=audioCtx.createBuffer(1,n,audioCtx.sampleRate),data=buf.getChannelData(0);
   for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*(1-i/n);
   const src=audioCtx.createBufferSource(),hp=audioCtx.createBiquadFilter(),g=audioCtx.createGain();src.buffer=buf;hp.type='highpass';hp.frequency.value=1700;
   g.gain.setValueAtTime(.0001,t+delay);g.gain.exponentialRampToValueAtTime(.095,t+delay+.004);g.gain.exponentialRampToValueAtTime(.0001,t+delay+.065);
   src.connect(hp);hp.connect(g);g.connect(audioCtx.destination);src.start(t+delay);
   tone(1850,620,.12,'sine',.075,delay+.012);tone(1120,2300,.16,'triangle',.045,delay+.055);tone(520,260,.18,'sine',.035,delay+.12);
  };
  if(kind==='open'||kind==='alert'){spark();tone(660,990,.22,'sine',.035,.09);tone(990,1480,.28,'sine',.026,.19)}
  else if(kind==='level'){spark();tone(220,440,.32,'sine',.055,.08);tone(440,880,.38,'triangle',.045,.18);tone(880,1320,.5,'sine',.035,.28)}
  else if(kind==='penalty'){tone(170,95,.24,'sine',.06);tone(420,190,.18,'triangle',.035,.08);spark(.18)}
  else if(kind==='claim'){spark();tone(740,1110,.16,'sine',.035,.13)}
  else {tone(760,520,.055,'sine',.018)}
 }catch(e){}
}
let thunderLoopStarted=false,thunderUntil=0;
function triggerThunder(force=false){
 const canvas=document.getElementById('thunder-canvas');if(!canvas)return;
 thunderUntil=Math.max(thunderUntil,performance.now()+(force?1400:800));
 document.body.classList.add('thunder-hit');setTimeout(()=>document.body.classList.remove('thunder-hit'),360);
 if(thunderLoopStarted)return;thunderLoopStarted=true;
 const ctx=canvas.getContext('2d');let dpr=1;
 function resize(){dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.floor(innerWidth*dpr);canvas.height=Math.floor(innerHeight*dpr);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
 resize();window.addEventListener('resize',resize);
 function jagged(x1,y1,x2,y2,segments=7,spread=8){const pts=[[x1,y1]];for(let i=1;i<segments;i++){const f=i/segments;pts.push([x1+(x2-x1)*f+(Math.random()-.5)*spread,y1+(y2-y1)*f+(Math.random()-.5)*spread])}pts.push([x2,y2]);return pts}
 function strokePath(pts,color,width,glow){ctx.beginPath();ctx.moveTo(...pts[0]);for(let i=1;i<pts.length;i++)ctx.lineTo(...pts[i]);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.shadowColor=glow;ctx.shadowBlur=12;ctx.stroke();ctx.shadowBlur=0}
 let lastFrame=0;function frame(now){if(now-lastFrame<40){requestAnimationFrame(frame);return}lastFrame=now;ctx.clearRect(0,0,innerWidth,innerHeight);
  // A moving electric runner travels along every visible panel edge; short forks create branching rays.
  const panels=[...document.querySelectorAll('.top,.card,.status-screen,.attr-tile,.metric,.body-training')].filter(el=>el.getClientRects().length).slice(0,36);
  const active=panels.filter(el=>{const r=el.getBoundingClientRect();return r.bottom>0&&r.top<innerHeight&&r.right>0&&r.left<innerWidth});
  active.forEach((el,idx)=>{const r=el.getBoundingClientRect(),pad=2;const x1=Math.max(-20,r.left+pad),y1=Math.max(-20,r.top+pad),x2=Math.min(innerWidth+20,r.right-pad),y2=Math.min(innerHeight+20,r.bottom-pad);if(x2<=x1||y2<=y1)return;
   const perimeter=2*((x2-x1)+(y2-y1));let phase=(now*.12+idx*73)%Math.max(perimeter,1);const len=Math.min(74,perimeter*.22);for(let arc=0;arc<2;arc++){let pos=(phase+arc*perimeter*.48)%perimeter;let points=[];for(let k=0;k<=8;k++){let q=(pos+len*k/8)%perimeter;let x,y,w=x2-x1,h=y2-y1;if(q<w){x=x1+q;y=y1}else if((q-=w)<h){x=x2;y=y1+q}else if((q-=h)<w){x=x2-q;y=y2}else{x=x1;y=y2-(q-w)}points.push([x,y])}
    // Jitter the moving arc into a sharp, electric path.
    for(let k=1;k<points.length-1;k++){points[k][0]+=(Math.random()-.5)*4;points[k][1]+=(Math.random()-.5)*4}
    const hue=getComputedStyle(document.body).getPropertyValue('--energy').trim()||'#32baff';strokePath(points,'rgba(255,255,255,.9)',1.1,hue);strokePath(points,hue,2.5,hue);
    if(Math.random()>.62){let p=points[Math.floor(Math.random()*(points.length-1))],end=[p[0]+(Math.random()-.5)*18,p[1]+(Math.random()-.5)*18];let fork=jagged(p[0],p[1],end[0],end[1],4,5);strokePath(fork,'rgba(255,255,255,.8)',.8,hue);strokePath(fork,hue,1.7,hue)}
   }
  });
  // Occasional brighter screen-opening crackle, not a giant flash that hides the UI.
  if(now<thunderUntil){ctx.fillStyle='rgba(90,180,255,.025)';ctx.fillRect(0,0,innerWidth,innerHeight)}
  requestAnimationFrame(frame)
 }
 requestAnimationFrame(frame);
}
window.addEventListener('resize',()=>{let c=document.getElementById('thunder-canvas');if(c){c.width=innerWidth*(devicePixelRatio||1);c.height=innerHeight*(devicePixelRatio||1)}});
let firstAudioGesture=false;window.addEventListener('pointerdown',()=>{if(!firstAudioGesture&&S.soundOn){firstAudioGesture=true;sfx('open')}else if(S.soundOn&&audioCtx&&audioCtx.state==='suspended'){audioCtx.resume()}},{once:false,passive:true});
function checkDeadline(){let key=today();let prior=S.lastActiveDay||key;if(prior!==key){let done=(S.bodyTasks[prior]||[]);if(!BODY_TASKS.every(t=>done.includes(t.id))&&(!S.penalty||S.penalty.date!==key)){let loss=10+Math.floor(Math.random()*26);let actual=Math.min(S.xp,loss);S.xp-=actual;S.penalty={date:key,loss:actual,resolved:false,sourceDay:prior};save();setTimeout(()=>systemAlert('PENALTY ZONE ACTIVATED','Yesterday’s Body Training protocol was incomplete. A randomized '+actual+' XP penalty has been applied. Complete the safe Penalty Protocol below to unlock the system. Rest, illness, injury or unsafe conditions are valid reasons to choose a low-energy alternative.','−'+actual+' XP · PENALTY PROTOCOL REQUIRED'),300)}S.lastActiveDay=key;save()}else if(!S.lastActiveDay){S.lastActiveDay=key;save()}}
function activePenalty(){return !!(S.penalty&&!S.penalty.resolved)}
function resolvePenalty(){if(!activePenalty())return;S.penalty.resolved=true;save();sfx('level');render();systemAlert('PENALTY CLEARED','Protocol completed. The restriction is lifted. Reset, recover, and continue at a sustainable pace.','SYSTEM ACCESS RESTORED')}

function streak(){let n=0,d=new Date();while(true){let k=d.toLocaleDateString('en-CA');if(!(S.claimHistory||[]).includes(k))break;n++;d.setDate(d.getDate()-1)}return n}
function toast(s){let e=document.querySelector('#toast');e.textContent='▸ '+s;e.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.classList.add('hidden'),2600)}
function systemAlert(title,body,reward=''){sfx(title.includes('PENALTY')?'penalty':title.includes('LEVEL UP')?'level':'alert');if(title.includes('LEVEL UP')||title.includes('PENALTY')||title.includes('ARISE'))triggerThunder(true);let root=document.querySelector('#alert-root');root.innerHTML=`<div class="sys-overlay" id="sys-overlay"><section class="sys-alert" role="dialog" aria-modal="true" aria-label="System notification"><div class="alert-label">✦ SYSTEM NOTIFICATION · PLAYER INTERFACE</div><div class="alert-heading">${esc(title)}</div><div class="alert-body">${esc(body)}</div>${reward?`<div class="alert-reward">${esc(reward)}</div>`:''}<div class="alert-actions"><button class="alert-dismiss" id="dismiss-alert">ACKNOWLEDGE ▸</button></div></section></div>`;let close=()=>{let box=document.querySelector('.sys-alert');if(box){box.style.animation='alertOut .18s forwards';setTimeout(()=>root.innerHTML='',180)}};document.querySelector('#dismiss-alert').onclick=()=>{sfx('open');close()};document.querySelector('#sys-overlay').onclick=e=>{if(e.target.id==='sys-overlay')close()};document.onkeydown=function handler(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',handler)}}}
function card(title,body,cls=''){return `<section class="card ${cls}"><h2>${title}</h2>${body}</section>`}
function renderHeader(){themeLevel();document.querySelector('#rank').textContent=rank()+'-RANK';document.querySelector('#level').textContent='LV. '+lv();document.querySelector('#totalxp').textContent=S.xp;document.querySelector('#xpfill').style.width=(S.xp%100)+'%';document.querySelector('#xptext').textContent=(S.xp%100)+' / 100 XP';document.querySelector('#tolevel').textContent=(100-S.xp%100)+' XP TO LEVEL UP';document.querySelector('#todayxp').textContent=dailyClaimedXP();document.querySelector('#todayquests').textContent=checked().length+' quests complete';document.querySelector('#points').textContent=left();document.querySelector('#streak').textContent=streak()+' DAYS'}
function questList(){return QUESTS.map(q=>{let done=checked().includes(q.id),paid=rewarded().includes(q.id);return `<label class="quest"><input type="checkbox" data-quest="${q.id}" ${done?'checked':''} ${paid||activePenalty()?'disabled':''}><div class="qbody"><div class="qname">${q.icon} ${q.name} ${paid?'<span class="tag">XP CLAIMED ✓</span>':''}</div><div class="qdesc">${q.desc}</div></div><span class="xp">+${q.xp} XP</span></label>`}).join('')}
function claimHTML(){let amount=dailyXP();if(amount>0)return `<div class="actions"><button class="primary" id="claim">⚡ CLAIM SELECTED QUEST XP · +${amount}</button><button id="clearchecks" ${activePenalty()?'disabled':''}>Clear unclaimed checks</button></div><p class="notice">You can claim multiple times per day. Each quest pays XP once; claimed quests lock individually, not the entire checklist.</p>`;return `<div class="tag">${claimed()?'ALL DAILY QUEST REWARDS CLAIMED ✓':'SELECT A COMPLETED QUEST TO CLAIM XP'}</div>`}
function bodyTrainingHTML(){let tasks=BODY_TASKS.map(t=>`<label class="body-task"><input type="checkbox" data-bodytask="${t.id}" ${bodyChecked().includes(t.id)?'checked':''} ${activePenalty()?'disabled':''}><span><strong>${t.name}</strong><small>${t.desc}</small></span></label>`).join('');let pen=activePenalty()?`<div class="penalty-zone"><h3>⚠ PENALTY ZONE · ACCESS LOCKED</h3><p>Random XP penalty applied: <strong>−${S.penalty.loss} XP</strong>. Complete one safe reset protocol to continue.</p><label class="body-task"><input type="checkbox" id="penalty-confirm"><span><strong>Penalty Protocol</strong><small>Choose a safe option: 5 minutes of room/desk reset + a short reflection, OR gentle mobility, OR an easy walk if safe. Hydrate and do not exercise through pain or illness.</small></span></label><button id="resolve-penalty" disabled>COMPLETE PENALTY PROTOCOL</button></div>`:'';return `<details class="body-training" id="body-training"><summary>⚡ BODY TRAINING · DAILY PROTOCOL <span class="tag">${bodyChecked().length}/${BODY_TASKS.length}</span></summary><div class="body-content"><div class="timer-line"><span>DAILY RESET IN</span><span id="body-timer">${clockText()}</span></div><p class="notice">Scale reps to your current ability. The 3 km target can be a walk. Rest when needed; pain, illness and unsafe weather always override the quest.</p>${tasks}<div class="row space" style="margin-top:12px"><label class="qname" for="workout-choice">WORKOUT OPTION</label><select id="workout-choice" class="field" style="max-width:58%">${Object.keys(WORKOUTS).map(x=>`<option>${x}</option>`).join('')}</select></div><div id="workout-desc" class="notice" style="margin-top:8px">${WORKOUTS['Full-body option']}</div><div class="actions"><button id="workout-done" class="primary" ${activePenalty()?'disabled':''}>✓ MARK WORKOUT OPTION DONE</button><button id="body-reset">RESET BODY CHECKS</button></div><p class="notice">Complete the five baseline tasks to mark Body Training as complete for daily XP. The optional workout is an extra choice, not a requirement on top of everything.</p>${pen}</div></details>`}
function dashboard(){return `<div class="col">
<section class="status-screen"><div class="status-title">PLAYER STATUS · PERSONAL GROWTH SYSTEM</div><div class="status-hero"><div class="level-orb"><small>LEVEL</small><strong>${lv()}</strong><small>${rank()}-RANK</small></div><div class="hero-info"><div class="hero-rank">${rank()}-RANK HUNTER</div><p>PLAYER: YOU · MODE: BALANCED</p><p>${S.xp%100} / 100 XP TO NEXT LEVEL</p><div class="xpbar"><span style="width:${S.xp%100}%"></span></div><p style="margin-top:8px">${left()} STAT POINTS AVAILABLE · ${S.xp} TOTAL XP</p></div></div><div class="attr-grid">${ATTRS.map(([id,n,d])=>{let val=1+(S.stats[id]||0),pct=Math.min(100,Math.round(val/20*100));return `<div class="attr-tile"><div class="attr-head"><span class="attr-code">${id}</span><span class="muted" style="font-size:9px">ATTRIBUTE</span></div><div class="attr-value">${val}</div><div class="attr-name">${n}</div><div class="attr-sub">${d}</div><div class="attr-bar"><span style="width:${pct}%"></span></div></div>`}).join('')}</div><div class="actions"><button class="primary" data-goto="stats">✧ ALLOCATE STAT POINTS</button><button data-goto="quests">☑ OPEN QUESTS</button></div></section>
<div class="layout"><div class="col">
${card('SYSTEM MESSAGE',`<h3 style="font-size:20px;color:#d8f4ff">Your real-life awakening begins now.</h3><p class="muted">Build strength, intelligence, discipline, career skills and confidence through completed quests. No penalties for rest or missed days.</p><div class="row"><span class="tag">FOCUS: ${esc(S.focus)}</span><span class="tag">BALANCED DIFFICULTY</span></div>`)}
${card('DAILY QUEST BOARD',bodyTrainingHTML()+questList()+claimHTML())}
${card('HUNTER LOG',`<div class="row space"><div><strong>${checked().length} / ${QUESTS.length}</strong><div class="muted">Daily quests checked</div></div><div style="min-width:45%;flex:1"><div class="xpbar"><span style="width:${checked().length/QUESTS.length*100}%"></span></div></div></div><p class="notice">Check a quest only after completing it. Claiming XP locks today's checklist to prevent accidental double claims.</p>`)}
</div><div class="col">
${card('SYSTEM RECORD',`<div class="stat"><div class="statcode">XP</div><div><div class="statname">Lifetime Experience</div><div class="statdesc">Total earned through completed quests</div></div><div class="statval">${S.xp}</div></div><div class="stat"><div class="statcode">DAY</div><div><div class="statname">Daily Quest Progress</div><div class="statdesc">${checked().length} of ${QUESTS.length} completed</div></div><div class="statval">${Math.round(checked().length/QUESTS.length*100)}%</div></div><div class="stat"><div class="statcode">🔥</div><div><div class="statname">Consistency Streak</div><div class="statdesc">Days with XP claimed</div></div><div class="statval">${streak()}</div></div>`)}
${card('WEEKLY BOSS',`<div class="qname" style="font-size:18px">${esc(S.boss.name)}</div><p class="muted">${bossDesc()}</p><div class="row space"><span class="xp">REWARD +25 XP</span><button data-goto="bosses">OPEN BOSS ROOM →</button></div>`)}
${card('SYSTEM TIP',`<p class="muted">Consistency beats intensity. Choose sustainable tasks, protect your sleep, and let real evidence—not the number on the screen—measure your growth.</p>`)}
</div></div></div>`}
function questsPage(){return card('DAILY QUESTS',`<p class="muted">Your checklist is date-based. You can change checks until you claim the reward.</p>${bodyTrainingHTML()}${questList()}${claimHTML()}`)}
function statsPage(){return card('ATTRIBUTE ALLOCATION',`<div class="row space"><span class="muted">Available points</span><strong style="font-size:24px;color:var(--gold)">${left()}</strong></div><p class="notice">Gain 3 points each time you level up. Starting attribute level is 1.</p>`+ATTRS.map(([id,n,d])=>`<div class="stat"><div class="statcode">${id}</div><div><div class="statname">${n}</div><div class="statdesc">${d}</div><div class="notice">${S.stats[id]||0} points invested</div></div><div style="text-align:right"><div class="statval">Lv. ${1+(S.stats[id]||0)}</div><button class="small" data-alloc="${id}" ${left()===0?'disabled':''}>+1</button></div></div>`).join('')+`<p class="notice">Stats are motivational game attributes, not a scientific score.</p>`)}
function skillsPage(){return `<div class="card"><h2>SKILL TREES</h2><p class="muted">Unlock milestones by doing the work in real life. Ticking these is a record, not an automatic skill boost.</p>${TREES.map(([name,steps])=>`<div style="margin-top:17px"><h3 style="color:var(--cyan)">${name}</h3>${steps.map((step,i)=>{let id=name+'::'+step,done=S.skills.includes(id);return `<div class="skill"><label><input type="checkbox" data-skill="${esc(id)}" ${done?'checked':''}><span><strong>${esc(step)}</strong><small class="muted">${done?'MILESTONE UNLOCKED':'MILESTONE '+(i+1)}</small></span></label></div>`}).join('')}</div>`).join('')}</div>`}
function bossDesc(){return ({'Code Builder':'Finish and demonstrate one working project feature.','Knowledge Keeper':'Explain a topic and solve practice questions without notes.','Discipline Trial':'Complete your priority task on five days this week.','Social Challenge':'Practise a communication skill and reflect on what you learned.'})[S.boss.name]}
function bossesPage(){return card('WEEKLY BOSS ROOM',`<p class="muted">Select one boss. Complete the real-world condition and keep evidence before claiming the reward.</p><select id="bossselect" class="field">${['Code Builder','Knowledge Keeper','Discipline Trial','Social Challenge'].map(x=>`<option ${x===S.boss.name?'selected':''}>${x}</option>`).join('')}</select><div style="padding:16px 0"><div class="sub">TARGET</div><h3 style="font-size:21px;margin:5px 0">${esc(S.boss.name)}</h3><p>${bossDesc()}</p><div class="xp">REWARD · +25 XP</div></div><label class="quest"><input type="checkbox" id="bossdone" ${S.boss.done?'checked':''} ${S.boss.claimedWeek===weekKey()?'disabled':''}><div class="qbody"><div class="qname">Boss condition completed</div><div class="qdesc">I completed the task and can show evidence.</div></div></label><div class="actions"><button class="primary" id="bossclaim" ${!S.boss.done||S.boss.claimedWeek===weekKey()?'disabled':''}>CLAIM BOSS REWARD</button></div><p class="notice">One reward per week. No penalties for missing a boss.</p>${S.boss.claimedWeek===weekKey()?'<div class="tag">THIS WEEK’S BOSS REWARD CLAIMED ✓</div>':''}`)}
function achievementsPage(){return card('ACHIEVEMENT ARCHIVE',ACHS.map(([id,name,desc,icon])=>{let auto=(id==='first'&&S.xp>0)||(id==='levelup'&&S.xp>=100)||(id==='boss'&&!!S.boss.claimedWeek)||(id==='monarch'&&S.xp>=2900),ok=auto||S.achievements.includes(id);return `<div class="achievement"><div class="achicon">${ok?'🏅':'◇'}</div><div class="grow"><strong>${icon} ${name}</strong><div class="qdesc">${desc}</div></div>${ok?'<span class="tag">UNLOCKED</span>':`<button class="small" data-ach="${id}">Mark earned</button>`}</div>`}).join(''))}
function journalPage(){return card('HUNTER JOURNAL',`<p class="muted">Log a win, a challenge and your next action. Entries are saved on this device.</p><textarea id="journaltext" class="field journal" placeholder="Today's wins… What I learned… What challenged me… Next quest…"></textarea><div class="actions"><button class="primary" id="savejournal">SAVE ENTRY</button><button id="exportjournal">EXPORT JOURNAL</button></div><h3 style="margin-top:22px">PREVIOUS ENTRIES</h3>${(S.journal||[]).slice().reverse().map(j=>`<div class="achievement"><div class="grow"><strong>${esc(j.date)}</strong><div style="white-space:pre-wrap;margin-top:5px">${esc(j.text)}</div></div><button class="small danger" data-deljournal="${j.id}">Delete</button></div>`).join('')||'<p class="muted">No entries yet.</p>'}`)}
function settingsPage(){return card('SAVE & SETTINGS',`<p>Your progress saves in this browser on this device. Use a backup to move progress between devices.</p><div class="actions"><button class="primary" id="exportbackup">⬇ EXPORT BACKUP (.JSON)</button><label for="importbackup" style="flex:1"><span style="display:block;text-align:center;cursor:pointer" class="field">⬆ IMPORT BACKUP</span></label><input id="importbackup" type="file" accept=".json,application/json" class="hidden"></div><hr style="border-color:var(--line);margin:18px 0"><label class="body-task"><input type="checkbox" id="sound-toggle" ${S.soundOn?'checked':''}><span><strong>System sound effects</strong><small>Short electric ignition/spark chime. Browsers require a tap or click before audio can play.</small></span></label><div class="actions"><button id="test-sound" class="primary">⚡ TEST SYSTEM AUDIO</button><button id="test-thunder">ϟ TEST THUNDER EFFECT</button></div><p class="audio-help">If silent: click Test System Audio once, check your device volume, then try claiming a quest.</p><label class="qname" for="focus">Current focus</label><select id="focus" class="field" style="margin-top:7px">${['Balanced Growth','Physical Development','Intelligence & Study','Coding & AI','Career & Money','Social Confidence'].map(x=>`<option ${S.focus===x?'selected':''}>${x}</option>`).join('')}</select><div class="actions"><button id="reset" class="danger">RESET ALL PROGRESS</button></div><p class="notice" style="margin-top:15px">For use on another device, export the JSON backup here, transfer it to that device, open this app and import it. Import replaces current local data. This version does not cloud-sync automatically.</p>`)}
function render(){let bodyWasOpen=!!document.querySelector('#body-training')?.open;renderHeader();document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.disabled=activePenalty()&&!['dashboard','quests'].includes(b.dataset.tab)});let views={dashboard,quests:questsPage,stats:statsPage,skills:skillsPage,bosses:bossesPage,achievements:achievementsPage,journal:journalPage,settings:settingsPage};document.querySelector('#view').innerHTML=views[tab]();let newBody=document.querySelector('#body-training');if(newBody&&bodyWasOpen)newBody.open=true;bind()}
function download(name,data,type){let blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function bind(){
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(activePenalty()&&!['dashboard','quests'].includes(b.dataset.tab)){toast('PENALTY ZONE ACTIVE · CLEAR PROTOCOL FIRST');sfx('penalty');return}tab=b.dataset.tab;render();sfx('tap')});
 let bodyPanel=document.querySelector('#body-training');if(bodyPanel)bodyPanel.addEventListener('toggle',()=>{if(bodyPanel.open)sfx('alert')});
 document.querySelectorAll('[data-bodytask]').forEach(el=>el.onchange=()=>{let a=bodyChecked();S.bodyTasks[today()]=el.checked?[...new Set([...a,el.dataset.bodytask])]:a.filter(x=>x!==el.dataset.bodytask);if(bodyComplete()){S.quests[today()]=[...new Set([...(S.quests[today()]||[]),'body'])];sfx('claim');setTimeout(()=>systemAlert('BODY PROTOCOL COMPLETE','All five baseline body tasks have been recorded. Remember: consistency and safe form matter more than speed.','STRENGTH QUEST READY'),100)}save();render()});
 let wc=document.querySelector('#workout-choice');if(wc)wc.onchange=()=>{document.querySelector('#workout-desc').textContent=WORKOUTS[wc.value];sfx('tap')};
 let wd=document.querySelector('#workout-done');if(wd)wd.onclick=()=>{sfx('claim');systemAlert('WORKOUT OPTION LOGGED','You selected: '+(document.querySelector('#workout-choice')?.value||'Workout')+'. Use this as an optional routine and scale it to your ability.','BONUS TRAINING RECORDED')};
 let br=document.querySelector('#body-reset');if(br)br.onclick=()=>{if(confirm('Clear today’s body-training checks?')){S.bodyTasks[today()]=[];if(S.quests[today()])S.quests[today()]=S.quests[today()].filter(x=>x!=='body');save();render()}};
 let pc=document.querySelector('#penalty-confirm'),pr=document.querySelector('#resolve-penalty');if(pc&&pr)pc.onchange=()=>{pr.disabled=!pc.checked};if(pr)pr.onclick=()=>{if(pc?.checked)resolvePenalty()};
 document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{if(activePenalty()&&!['dashboard','quests'].includes(b.dataset.goto)){toast('PENALTY ZONE ACTIVE · CLEAR PROTOCOL FIRST');sfx('penalty');return}tab=b.dataset.goto;render();sfx('tap')});
 document.querySelectorAll('[data-quest]').forEach(el=>el.onchange=()=>{if(el.dataset.quest==='body'&&el.checked&&!bodyComplete()){el.checked=false;toast('COMPLETE THE BODY TRAINING BASELINE FIRST');sfx('penalty');return}let arr=checked();S.quests[today()]=el.checked?[...new Set([...arr,el.dataset.quest])]:arr.filter(x=>x!==el.dataset.quest);save();render();sfx('tap')});
 let c=document.querySelector('#claim');if(c)c.onclick=()=>{let selected=QUESTS.filter(q=>checked().includes(q.id)&&!rewarded().includes(q.id));if(!selected.length)return;let amount=selected.reduce((a,q)=>a+q.xp,0),oldLevel=lv();S.xp+=amount;S.questRewards=S.questRewards||{};S.questRewards[today()]=[...new Set([...rewarded(),...selected.map(q=>q.id)])];S.claimed=[...new Set([...(S.claimed||[]),today()])];S.claimHistory=[...new Set([...(S.claimHistory||[]),today()])];save();render();sfx(lv()>oldLevel?'level':'claim');if(lv()>oldLevel)systemAlert('LEVEL UP!','Quest rewards increased your Hunter Level. Three stat points are now available to allocate.','LEVEL '+oldLevel+'  →  LEVEL '+lv()+'  ·  +3 STAT POINTS');else systemAlert('QUEST REWARDS ACQUIRED','XP awarded for '+selected.length+' quest'+(selected.length===1?'':'s')+'. Other unclaimed quests remain available.','+'+amount+' XP ACQUIRED')};
 let clear=document.querySelector('#clearchecks');if(clear)clear.onclick=()=>{S.quests[today()]=checked().filter(id=>rewarded().includes(id));save();render()};
 document.querySelectorAll('[data-alloc]').forEach(b=>b.onclick=()=>{if(left()>0){S.stats[b.dataset.alloc]=(S.stats[b.dataset.alloc]||0)+1;save();render()}});
 document.querySelectorAll('[data-skill]').forEach(el=>el.onchange=()=>{S.skills=el.checked?[...new Set([...S.skills,el.dataset.skill])]:S.skills.filter(x=>x!==el.dataset.skill);save();render()});
 document.querySelectorAll('[data-ach]').forEach(b=>b.onclick=()=>{S.achievements=[...new Set([...S.achievements,b.dataset.ach])];save();render();systemAlert('ACHIEVEMENT UNLOCKED','You recorded a milestone in your personal progression archive.','MILESTONE RECORDED')});
 let bs=document.querySelector('#bossselect');if(bs)bs.onchange=()=>{S.boss.name=bs.value;S.boss.done=false;save();render()};
 let bd=document.querySelector('#bossdone');if(bd)bd.onchange=()=>{S.boss.done=bd.checked;save();render()};
 let bc=document.querySelector('#bossclaim');if(bc)bc.onclick=()=>{if(S.boss.done&&S.boss.claimedWeek!==weekKey()){let oldLevel=lv();S.xp+=25;S.boss.claimedWeek=weekKey();save();render();sfx(lv()>oldLevel?'level':'claim');if(lv()>oldLevel)systemAlert('LEVEL UP!','The weekly boss reward pushed your level higher. Three stat points are now available.','LEVEL '+oldLevel+'  →  LEVEL '+lv());else systemAlert('BOSS DEFEATED','You completed your weekly real-life challenge. Your record has been updated.','+25 XP ACQUIRED')}};
 let sj=document.querySelector('#savejournal');if(sj)sj.onclick=()=>{let text=document.querySelector('#journaltext').value.trim();if(text){S.journal.push({id:Date.now().toString(),date:today(),text});save();render();toast('JOURNAL ENTRY SAVED')}};
 let ej=document.querySelector('#exportjournal');if(ej)ej.onclick=()=>download('solo-system-journal.txt',S.journal.map(j=>j.date+'\n'+j.text).join('\n\n'),'text/plain');
 document.querySelectorAll('[data-deljournal]').forEach(b=>b.onclick=()=>{S.journal=S.journal.filter(j=>j.id!==b.dataset.deljournal);save();render()});
 let ex=document.querySelector('#exportbackup');if(ex)ex.onclick=()=>download('solo-system-backup.json',JSON.stringify(S,null,2),'application/json');
 let im=document.querySelector('#importbackup');if(im)im.onchange=async()=>{if(!im.files[0])return;try{let x=JSON.parse(await im.files[0].text());if(typeof x.xp!=='number'||!x.stats||!x.quests)throw Error('invalid');S={...fresh(),...x};save();render();toast('BACKUP IMPORTED')}catch(e){alert('This backup file is not valid.')}}; 
 let st=document.querySelector('#sound-toggle');if(st)st.onchange=()=>{S.soundOn=st.checked;save();if(S.soundOn){sfx('open');toast('SYSTEM AUDIO ENABLED')}};let ts=document.querySelector('#test-sound');if(ts)ts.onclick=()=>{S.soundOn=true;if(st)st.checked=true;save();sfx('open');toast('SYSTEM SPARK TEST')};let tt=document.querySelector('#test-thunder');if(tt)tt.onclick=()=>{triggerThunder(true);sfx('open');toast('THUNDER BORDER TEST')};
 let f=document.querySelector('#focus');if(f)f.onchange=()=>{S.focus=f.value;save();render()};
 let r=document.querySelector('#reset');if(r)r.onclick=()=>{if(confirm('Permanently reset all local progress? Export a backup first if you may need it.')){S=fresh();save();tab='dashboard';render();toast('SYSTEM RESET')}};
}
if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}load();checkDeadline();render();setInterval(()=>{let t=document.querySelector('#body-timer');if(t)t.textContent=clockText();},1000);setInterval(()=>{let before=S.penalty&&S.penalty.date;checkDeadline();if((S.penalty&&S.penalty.date)!==before)render()},30000);if(!sessionStorage.getItem('solo-system-intro-shown')){sessionStorage.setItem('solo-system-intro-shown','1');setTimeout(()=>systemAlert('WELCOME, PLAYER','System interface online. Your first-page attributes are ready. Complete real-life quests, claim XP, and allocate stat points as you level up.' ,'AWAKENING PROTOCOL: ACTIVE'),450)}
setTimeout(()=>triggerThunder(true),250);setInterval(()=>{if(Math.random()>.25&&!document.hidden)triggerThunder(false)},2600);
</script></body></html>
